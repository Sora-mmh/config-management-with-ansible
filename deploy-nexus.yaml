---
- name: Install java and net-tools
  hosts: nexus_server
  become: yes
  tasks:
    - name: Update yum repo and cache
      yum: update_cache=yes
    - name: Install Java 8
      yum: name=java-1.8.0-openjdk-headless #openjdk-8-jre-headless
    - name: Install net-tools
      yum: name=net-tools

- name: Download and unpack Nexus Installer
  hosts: nexus_server
  become: yes
  tasks:
    - name: Check nexus folder stat
      stat:
        path: /opt/nexus
      register: stat_result
    - debug: msg={{stat_result}}
    - name: Download Nexus
      get_url: 
        url: https://download.sonatype.com/nexus/3/latest-linux-x86_64.tar.gz
        dest: /opt/
      register: download_result
    - debug: msg={{download_result}}
    - name: Untar Nexus Installer
      unarchive:
        src: "{{download_result.dest}}" #/opt/nexus-3.82.0-08-linux-x86_64.tar.gz
        dest: /opt/
        remote_src: yes
      when: not stat_result.stat.exists
    - name: Find nexus folder 
      find: 
        paths: /opt
        pattern: "nexus-*"
        file_type: directory
      register: find_result
    - debug: msg={{find_result}}
    - name: Rename nexus folder
      shell: mv {{find_result.files[0].path}} /opt/nexus
      when: not stat_result.stat.exists

- name: Create nexus user to own nexus folder
  hosts: nexus_server
  become: yes
  tasks:
    - name: Ensure group nexus exists
      group:
        name: nexus
        state: present
    - name: Create nexus user
      user:
        name: nexus
        group: nexus
    - name: Make nexus user  owner of nexus folder
      file:
        path: /opt/nexus
        state: directory
        owner: nexus
        group: nexus
        recurse: yes
    - name: Make nexus user  owner of sonatype-work folder
      file:
        path: /opt/sonatype-work
        state: directory
        owner: nexus
        group: nexus
        recurse: yes

- name: Start nexus with nexus user
  hosts: nexus_server
  become: yes
  become_user: nexus
  tasks:
    - name: Set run_as_user nexus
      # blockinfile: # Option 1 : a delimited block by ansible
      #   path: /opt/nexus/bin/nexus.rc 
      #   block: |
      #     run_as_user="nexus"
      #   # some_other_text="..."
      lineinfile: # Option 2 : change a single line
        path: /opt/nexus/bin/nexus.rc 
        regexp: '^#run_as_user=""'
        line: run_as_user="nexus"
    - name: Start nexus
      command: /opt/nexus/bin/nexus start

- name: Verify nexus running
  hosts: nexus_server
  tasks:
    - name: Check with ps
      shell: ps aux | grep nexus
      register: app_status
    - debug: msg={{app_status.stdout_lines}}
    - name: Wait one minute
      pause:
        minutes: 1
    - name: Check with netstat
      shell: netstat -lnpt
      register: app_status
    - debug: msg={{app_status.stdout_lines}}
           


