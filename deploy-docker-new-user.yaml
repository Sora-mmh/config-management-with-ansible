- name: Start docker containers
  hosts: docker_server
  become: yes
  vars_files:
    project-vars
  ### Option 1 for PASS to login into dockerhub
  vars_prompt:
    - name: docker_password_prompt
      prompt: Enter password for docker registry
  ### Option 2 for PASS to login into dockerhub
  # vars_files:
  #   - project-vars
  vars_files:
    project-vars
  become_user: "{{linux_name}}"
  tasks:
    - name: Copy docker compose
      copy:
        src: /home/montassar/devops-with-nana/ansible/bootcamp-java-mysql-project/docker-compose-full.yaml
        dest: /home/{{linux_name}}/docker-compose.yaml
    - name: Docker login
      docker_login: 
        username: sorammh8
        password: "{{docker_password_prompt}}" # or {{docker_password}} for option 2
    - name: Start containers from compose
      community.docker.docker_compose_v2:
        project_src: /home/{{linux_name}}
        state: present


