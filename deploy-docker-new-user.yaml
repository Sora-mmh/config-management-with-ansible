---
- name: Wait for SSH connection
  hosts: aws_ec2 # all
  gather_facts: False
  vars:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Ensure SSH port open
      wait_for:
        port: 22
        delay: 10
        timeout: 100
        search_regex: OpenSSH
        host: '{{ (ansible_ssh_host|default(ansible_host))|default(inventory_hostname) }}'
    
- name: Install Docker
  hosts: aws_ec2 # all # docker_server
  become: yes
  # become_user: root
  tasks:
    - name: Make sur Docker is installed
      yum:  
        name: docker
        update_cache: yes
        state: present
    - name: Ensure docker is running
      systemd:
        name: docker
        state: started

- name: Create a new linux user
  hosts: aws_ec2 # all
  become: yes
  vars_files:
    project-vars
  tasks:
    - name: Create a new linux user
      user:
        name: "{{linux_name}}"
        groups: "{{user_groups}}"

- name: Install Docker-compose
  hosts: aws_ec2 # all
  become: yes
  vars_files:
    project-vars
  become_user: "{{linux_name}}"
  tasks:
    - name: Create docker-compose directory
      file:
        path: ~/.docker/cli-plugins
        state: directory
    - name: Get architecture of remote machine
      shell: uname -m
      register: remote_arch
    - name: Install docker-compose
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{remote_arch.stdout}}"
        dest: ~/.docker/cli-plugins/docker-compose
        mode: +x

